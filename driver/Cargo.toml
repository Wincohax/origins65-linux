[package]
name = "origins65"
version = "0.1.0"
edition = "2024"
description = "Linux lighting driver and CLI for the HyperX Alloy Origins 65 keyboard (03f0:038f)"
license = "GPL-3.0-or-later"
repository = "https://github.com/Wincohax/origins65-linux"

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"
nusb = "0.1"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
