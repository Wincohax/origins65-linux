[package]
name = "origins65-gui"
version = "0.1.0"
edition = "2024"
description = "Desktop GUI for the HyperX Alloy Origins 65 Linux lighting driver"
license = "GPL-3.0-or-later"
repository = "https://github.com/Wincohax/origins65-linux"

[dependencies]
gpui = { package = "gpui-ce", version = "=0.3.0" }
gpui_platform = { package = "gpui_ce_platform", version = "=0.3.0" }
image = { version = "0.25", default-features = false, features = ["png"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
origins65 = { path = "../driver" }
